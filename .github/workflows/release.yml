name: Release

# Push a tag like v0.4.0 (matching "version" in module.json) to publish this module.
# The "## v0.4.0" section of CHANGELOG.md becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ('${{ github.ref_name }}' -replace '^v', '')

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $heading = [regex]::Escape('${{ github.ref_name }}')
          $match = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $heading\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no '## ${{ github.ref_name }}' section" }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding UTF8 notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = (Get-Content module.json -Raw | ConvertFrom-Json).name
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*).FullName --title "$name ${{ github.ref_name }}" --notes-file notes.md

      - name: Tell the registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          if ($env:GH_TOKEN) { gh workflow run publish.yml -R Git-Gud-Gym/registry }
          else { 'No REGISTRY_DISPATCH_TOKEN secret: the registry picks this release up on its next scheduled run.' }
