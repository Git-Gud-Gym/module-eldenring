; Git Gud Gym - Elden Ring module settings. Apply the next time the mod attaches.
; Gameplay toggles (immortality, falls, ...) live in the app and are saved in
; %LOCALAPPDATA%\GitGudGym\settings.ini.

[general]
; How often the mod checks HP, in milliseconds. Lower = catches lethal hits sooner.
poll_interval_ms=2
; Free-text tag written to every stats row, e.g. "Malenia NG+2 bleed build"
session_label=

[boss]
; Only enemies within this many meters of you are considered as the boss.
search_radius=80
; Ignore enemies whose max HP is below this (filters out trash mobs).
min_max_hp=300

[offsets]
; Verified statically against eldenring.exe 2.2.0.0 (game patch 1.12.0).
; Only change these if a game update breaks something; F8 in game dumps what they resolve to.
player=0x1E508
chr_list_begin=0x1F1B8
chr_list_end=0x1F1C0
chr_modules=0x190
module_data=0x0
module_physics=0x68
physics_pos=0x70
data_hp=0x138
data_max_hp=0x13C
data_flags=0x19B
no_dead_bit=0
; Fallback: also set the global debug "player no dead" flag (offset into ChrDbgFlags).
use_dbg_player_no_dead=0
dbg_player_no_dead=0x0
